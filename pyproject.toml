[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.poetry]
name = "spicy-snow"
version = "0.2.1"
description = "Use Sentinel-1 volumetric scattering at C-band to retrieve snow depths."
authors = ["Zachary Hoppinen <zachhoppinen@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/SnowEx/spicy-snow"
packages = [{include = "spicy_snow"}]

[tool.poetry.dependencies]
python = ">=3.9"
numpy = "*"
pandas = "*"
xarray = "*"
rioxarray = "*"
shapely = "*"
asf_search = "*"
earthaccess = "*"
matplotlib = "*"
netcdf4 = "*"
hyp3_sdk = "*"
h5py = "*"
pygeohydro = "*"
zarr = "*"

[tool.poetry.dev-dependencies]
pytest = "*"
black = "*"
isort = "*"
flake8 = "*"

[tool.bumpversion]
current_version = "0.3.0"
commit = true
tag = true
tag_name = "v{new_version}"
push = true
push_remote = "origin"
push_args = "--follow-tags"

[tool.bumpversion.file.setup_cfg]
search = "version = {current_version}"
replace = "version = {new_version}"

[tool.bumpversion.file.s1_lia.__init__]
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""
