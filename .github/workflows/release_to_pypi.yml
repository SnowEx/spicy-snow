name: Publish spicy-snow to PyPI & GitHub

# Trigger only on tag pushes
on:
  push:
    tags:
      - "*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    name: Build & Publish

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout source
        uses: actions/checkout@v3

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3️⃣ Install build tools
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # 4️⃣ Extract tag name for version
      - name: Extract tag
        id: tag
        run: echo "TAG_NAME=$(echo $GITHUB_REF | cut -d / -f 3)" >> $GITHUB_ENV

      # 5️⃣ Update setup.py version
      - name: Update version in setup.py
        run: sed -i "s/{{VERSION_PLACEHOLDER}}/${{ env.TAG_NAME }}/g" setup.py

      # 6️⃣ Build distributions
      - name: Build distributions
        run: python -m build

      # 7️⃣ Check built distributions
      - name: Twine check
        run: twine check dist/*

      # 8️⃣ Publish to PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      # 9️⃣ Create GitHub release
      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          release_name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          
      # 🔟 Upload distributions to GitHub release
      - name: Upload distributions
        run: |
          echo "Found dist files:"
          ls dist/
          for file in dist/*; do
            echo "Uploading $file"
            gh release upload ${{ env.TAG_NAME }} "$file"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
