name: Publish spicy-snow to PyPI & GitHub

# Trigger only on tag pushes
on:
  push:
    tags:
      - "*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout source
        uses: actions/checkout@v3

      # 2️⃣ Extract tag name as version
      - name: Extract tag
        run: echo "SPICY_SNOW_VERSION=${GITHUB_REF##*/}" >> $GITHUB_ENV

      # 3️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 4️⃣ Install build tools
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # 5️⃣ Build distributions
      - name: Build distributions
        run: python -m build
        env:
          SPICY_SNOW_VERSION: ${{ env.SPICY_SNOW_VERSION }}

      # 6️⃣ Check distributions with Twine
      - name: Twine check
        run: twine check dist/*

      # 7️⃣ Publish to PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      # 8️⃣ Create a GitHub Release
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.SPICY_SNOW_VERSION }}
          release_name: ${{ env.SPICY_SNOW_VERSION }}
          draft: false
          prerelease: false

      # 9️⃣ Upload all built distributions to the GitHub release
      - name: Upload distributions
        run: |
          for file in dist/*; do
            gh release upload ${{ env.SPICY_SNOW_VERSION }} "$file"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
