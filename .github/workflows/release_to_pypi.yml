name: Publish spicy_snow to PyPI / GitHub

on:
  push:
    tags:
      - "*"   # triggers on any tag push

jobs:
  build-n-publish:
    runs-on: ubuntu-latest
    name: Build and optionally publish to PyPI

    steps:
      # Checkout code
      - name: Checkout source
        uses: actions/checkout@v3

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # Extract tag name
      - name: Extract tag
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV

      # Update version in setup.py
      - name: Update version in setup.py
        run: |
          echo "Updating setup.py version to $TAG_NAME"
          sed -i "s/{{VERSION_PLACEHOLDER}}/${TAG_NAME}/g" setup.py

      # Build distributions
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      # Conditionally publish to PyPI
      - name: Publish to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      # Create GitHub release
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          release_name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false

      # Upload sdist to GitHub Release
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/$(ls dist | grep .tar.gz | head -1)
          asset_name: $(ls dist | grep .tar.gz | head -1)
          asset_content_type: application/gzip
