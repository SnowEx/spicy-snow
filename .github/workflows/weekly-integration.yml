name: Weekly integration tests

# Runs the slow, network-dependent integration tests (full retrieve_snow_depth
# pipeline) on a schedule, since they are skipped in the normal PR/push CI.
# On failure it opens (or comments on) a tracking issue so failures are visible.

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: read
  issues: write              # needed to open the alert issue on failure

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
          pip install pytest

      - name: Configure NASA Earthdata credentials
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          # OPERA RTC + VIIRS snowcover downloads authenticate against Earthdata.
          # Add EARTHDATA_USERNAME / EARTHDATA_PASSWORD as repository secrets.
          echo "machine urs.earthdata.nasa.gov login $EARTHDATA_USERNAME password $EARTHDATA_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Run integration tests
        run: pytest -m integration -v

      - name: Open/refresh alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Weekly integration tests failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled integration tests failed.\n\nRun: ${runUrl}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "ci-failure",
            });
            const dup = open.data.find(i => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["ci-failure"],
              });
            }
